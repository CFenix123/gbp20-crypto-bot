name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    if: ${{ vars.RENDER_HEALTH_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render so the free service does not sleep
        run: curl -fsS --retry 3 --retry-delay 10 "${{ vars.RENDER_HEALTH_URL }}"
